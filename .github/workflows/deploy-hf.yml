# ══════════════════════════════════════════════════════════════════════════════
#  deploy-hf.yml — Synchronise le dépôt GitHub vers HuggingFace Spaces
#
#  Déclencheur : push sur la branche `main`
#  Action      : force-push le code vers le Space HF (qui rebuild l'image Docker)
#
#  Secrets GitHub à configurer (Settings → Secrets → Actions) :
#    HF_TOKEN  → Token HuggingFace avec permission WRITE
#                (https://huggingface.co/settings/tokens)
#    HF_SPACE  → Identifiant du Space, format : "username/space-name"
#                Ex : "moncompte/unicef-chatbot"
#
#  Variables d'environnement à configurer dans le Space HF
#  (Settings → Variables and Secrets) :
#    MISTRAL_API_KEY → Clé API Mistral (https://console.mistral.ai)
#    LLM_PROVIDER    → mistral_api
#    ALLOWED_ORIGINS → ["*"]
# ══════════════════════════════════════════════════════════════════════════════
name: Deploy to HuggingFace Spaces

on:
  push:
    branches:
      - main

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Deploy to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          # ── Approche "clean-room" ──────────────────────────────────────────
          # Crée un dépôt git vierge (1 seul commit, 0 historique, 0 LFS)
          # pour éviter tout problème de binaires / LFS dans l'historique.
          # HF Spaces n'a besoin que du code courant pour rebuilder l'image.
          # ──────────────────────────────────────────────────────────────────

          # Copier les fichiers dans un dossier temporaire (sans le PDF)
          rsync -a \
            --exclude='.git' \
            --exclude='backend/data/documents/*.pdf' \
            ./ /tmp/hf-deploy/

          cd /tmp/hf-deploy

          # Initialiser un dépôt git propre
          git init
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          git add .
          git commit -m "deploy: ${{ github.sha }}"

          # Force-push vers HF Spaces (aucun historique, aucun binaire)
          git push \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" \
            HEAD:main --force

          echo "✓ Déployé vers https://huggingface.co/spaces/${HF_SPACE}"
